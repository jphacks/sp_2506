<svg width="32" height="32" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#backgroundGradient)" rx="20" />
  
  <!-- Left Head Silhouette -->
  <path
    d="M40 80 Q40 60, 60 60 Q80 60, 80 80 Q80 100, 60 100 Q40 100, 40 80 Z"
    fill="url(#headGradient)"
    opacity="0.7"
  />
  
  <!-- Right Head Silhouette -->
  <path
    d="M120 80 Q120 60, 140 60 Q160 60, 160 80 Q160 100, 140 100 Q120 100, 120 80 Z"
    fill="url(#headGradient)"
    opacity="0.7"
  />
  
  <!-- Central Network Circle -->
  <circle
    cx="100"
    cy="100"
    r="35"
    fill="rgba(255, 255, 255, 0.1)"
    stroke="rgba(255, 255, 255, 0.2)"
    stroke-width="2"
  />
  
  <!-- Network Nodes -->
  <circle cx="85" cy="85" r="3" fill="url(#nodeGlow)" />
  <circle cx="115" cy="85" r="3" fill="url(#nodeGlow)" />
  <circle cx="85" cy="115" r="3" fill="url(#nodeGlow)" />
  <circle cx="115" cy="115" r="3" fill="url(#nodeGlow)" />
  <circle cx="100" cy="100" r="4" fill="url(#nodeGlow)" />
  
  <!-- Network Connections -->
  <line x1="85" y1="85" x2="100" y2="100" stroke="rgba(96, 165, 250, 0.6)" stroke-width="1.5" />
  <line x1="115" y1="85" x2="100" y2="100" stroke="rgba(96, 165, 250, 0.6)" stroke-width="1.5" />
  <line x1="85" y1="115" x2="100" y2="100" stroke="rgba(96, 165, 250, 0.6)" stroke-width="1.5" />
  <line x1="115" y1="115" x2="100" y2="100" stroke="rgba(96, 165, 250, 0.6)" stroke-width="1.5" />
  <line x1="85" y1="85" x2="115" y2="115" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />
  <line x1="115" y1="85" x2="85" y2="115" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />
  
  <!-- Shield -->
  <path
    d="M100 70 L110 75 L110 90 Q110 95, 100 100 Q90 95, 90 90 L90 75 Z"
    fill="rgba(255, 255, 255, 0.9)"
    stroke="rgba(255, 255, 255, 0.3)"
    stroke-width="1"
  />
  
  <!-- Lock on Shield -->
  <rect
    x="95"
    y="80"
    width="10"
    height="8"
    rx="2"
    fill="rgba(255, 255, 255, 0.9)"
    stroke="rgba(255, 255, 255, 0.3)"
    stroke-width="0.5"
  />
  <circle
    cx="100"
    cy="78"
    r="2"
    fill="none"
    stroke="rgba(255, 255, 255, 0.9)"
    stroke-width="1"
  />
</svg>
