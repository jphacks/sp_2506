name: 🔍 Preview Deploy

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  preview:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: 📦 Install dependencies
      run: |
        cd jph-front-core && bun install
        cd ../jph-back-core && bun install
        cd .. && npm install
        
    - name: 🧪 Run tests
      run: |
        cd jph-back-core && bun test
        cd ../jph-front-core && bun run lint
        
    - name: 🏗️ Build projects
      run: |
        cd jph-front-core && VITE_API_BASE_URL=https://secretsync.t0waxx.com bun run build
        cd ../jph-back-core && bun run build
        
    - name: 🔍 Deploy Preview
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./
        vercel-args: '--prebuilt'
        
    - name: 📊 Preview Status
      run: |
        echo "🔍 Preview deployment completed!"
        echo "🌐 Check the preview URL in the Vercel dashboard"
